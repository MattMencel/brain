# Copy to ~/.config/brain/brain.toml (brain install does this). A connector runs when its table is
# present and enabled is not false.

[db]
mode = "docker"           # docker: brain runs its own ParadeDB container on 127.0.0.1:54329
# mode = "external"       # external: your own Postgres with pg_search
# dsn = "dbname=brain"

[schedule]
interval_minutes = 30
limit = 40                # max summarizer calls per run

[connectors.sessions]
# projects_dir = "~/.claude/projects"

[connectors.git]
roots = ["~/code"]        # every repo directly under each root
# since = "12 months ago"

# [connectors.jira]       # token: brain auth jira (an Atlassian API token)
# site = "example.atlassian.net"
# email = "you@example.com"
# projects = ["PROJ"]     # every ticket in these; elsewhere only tickets you report, are assigned or watch
# since_days = 365        # first run's window

# [connectors.slack]      # token: brain auth slack (user token of an internal Slack app; scopes in connectors/slack.py)
# user_id = "U0123456"    # your member id (Slack profile > Copy member ID); default "from:me"
# channels = ["C0123456"] # read in full; elsewhere only your threads, DMs, posts and mentions of you
# groups = ["S0123456"]   # user groups whose mentions to capture (the id in a mention's <@S...>)
# since_days = 30         # first run's window

# [connectors.github]     # pull requests through the gh CLI and its login (gh auth login); no brain token
# repos = ["owner/repo"]  # every PR in these; elsewhere only PRs that involve you
# since_days = 365        # first run's window

# [people.<name>]         # one person's names across sources, for brain events --actor <name>
# aliases = ["Ana Diaz", "ana.diaz", "adiaz"]  # brain install seeds [people.me] from git config user.name
